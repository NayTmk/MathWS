{% extends 'base.html' %}
{% block content %}
<div>
    <form action="/game" method="get">
    <label for="mode">Оберіть режим гри:</label>
    <select name="mode" id="mode">
        {% for operations, description in operations.items() %}
        <option value="{{ operations }}">{{ description }}</option>
        {% endfor %}
    </select>
    <button type="submit">Почати гру</button>
</form>
</div>
{% endblock %}
